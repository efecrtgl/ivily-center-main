[package]
name = "ivily-center"
version = "0.0.1"
description = "Ivily Center — standalone development environment and Ivily ecosystem hub"
authors = ["efecrtgl"]
license = "MIT"
repository = "https://github.com/efecrtgl/ivily-center-main"
edition = "2021"
rust-version = "1.82"

[lib]
name = "center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
parking_lot = "0.12"
dirs = "6"
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
