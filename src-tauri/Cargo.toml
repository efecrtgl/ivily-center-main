[package]
name = "ivily-center"
version = "0.0.1"
description = "Ivily Center — standalone development environment and Ivily ecosystem hub"
authors = ["efecrtgl"]
license = "MIT"
repository = "https://github.com/efecrtgl/ivily-center-main"
edition = "2021"
rust-version = "1.82"

[lib]
name = "center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
parking_lot = "0.12"
dirs = "6"
regex = "1"
dunce = "1"
tempfile = "3"
base64 = "0.22"
sha2 = "0.10"
ignore = "0.4"
globset = "0.4"
notify = "9"
trash = "5"
encoding_rs = "0.8"
portable-pty = "0.9"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
